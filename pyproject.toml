[project]
name = "sentinel-agent"
version = "0.1.0"
description = "Sentinel — Binance Agent OS Sentiment Trader (Hackathon Track A)"
authors = [{name="Sentinel Team"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv",
  "httpx",
  "mcp",
  "vaderSentiment",
  "feedparser",
  "requests",
  "google-generativeai",
  "groq",
  "openai",
  "pandas",
  "numpy",
  "ta",
  "streamlit",
  "plotly",
  "rich",
  "typer",
  "pytest",
  "binance-connector"
]

[project.scripts]
sentinel = "src.agent:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "api.sentiment:handler"
