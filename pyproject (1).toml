[project]
name = "sentinel-agent"
version = "0.1.0"
description = "Sentinel — Binance Agent OS Sentiment Trader (Hackathon Track A)"
authors = [{name="Sentinel Team"}]
readme = "README.md"
requires-python = ">=3.10"
# Minimal deps for Vercel Python function (keeps bundle <50MB)
# Heavy deps (pandas, streamlit, etc.) are in requirements.txt for local dev: pip install -r requirements.txt
dependencies = []

[project.scripts]
sentinel = "src.agent:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "api.sentiment:handler"
